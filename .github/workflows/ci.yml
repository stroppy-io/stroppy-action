name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    env:
      DURATION: 10s

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stroppy
          POSTGRES_PASSWORD: stroppy
          POSTGRES_DB: stroppy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stroppy -d stroppy_test"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          preset: tpcc
          driver-url: 'postgres://stroppy:stroppy@localhost:5432/stroppy_test'

      - name: Verify outputs
        env:
          EXIT_CODE: ${{ steps.test-action.outputs.exit-code }}
          RESULTS_FILE: ${{ steps.test-action.outputs.results-file }}
          ARTIFACT_ID: ${{ steps.test-action.outputs.artifact-id }}
        run: |
          echo "Exit code: ${EXIT_CODE}"
          echo "Results file: ${RESULTS_FILE}"
          echo "Artifact ID: ${ARTIFACT_ID}"

          if [ "${EXIT_CODE}" != "0" ]; then
            echo "::error::Benchmark exited with non-zero code"
            exit 1
          fi

          if [ -z "${RESULTS_FILE}" ]; then
            echo "::error::No results file produced"
            exit 1
          fi
