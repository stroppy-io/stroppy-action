name: Stroppy Benchmark Action
description: Run Stroppy database benchmarks via GitHub Actions
author: Stroppy-IO

branding:
  icon: activity
  color: blue

inputs:
  version:
    description: >-
      Stroppy release tag to install (e.g. v1.2.3). Use "latest" to fetch the
      most recent release.
    required: false
    default: 'latest'
  script:
    description: >-
      Path to a custom .ts benchmark script. Mutually exclusive with "preset".
    required: false
    default: ''
  sql-file:
    description: >-
      Path to a .sql file (only used with "script").
    required: false
    default: ''
  preset:
    description: >-
      Built-in benchmark preset name. One of: tpcb, tpcc, tpcds, simple,
      execute_sql. Mutually exclusive with "script".
    required: false
    default: ''
  driver-url:
    description: Database connection URL
    required: true
  scale-factor:
    description: Scale factor for the benchmark workload (SCALE_FACTOR)
    required: false
    default: ''
  duration:
    description: 'Test duration (e.g. 1h, 30m)'
    required: false
    default: ''
  vus-scale:
    description: >-
      VU scale multiplier for TPC-C (1 = 99 VUs, 0.5 ≈ 50, 0.1 ≈ 11). Only used
      with the tpcc preset.
    required: false
    default: ''
  pool-size:
    description: >-
      Connection pool size (max and min connections). Only used by scripts that
      read the POOL_SIZE env var.
    required: false
    default: ''
  log-level:
    description: 'Log level: debug, info, warn, error'
    required: false
    default: 'info'
  stroppy-args:
    description: Additional stroppy CLI arguments (passed before --)
    required: false
    default: ''
  k6-args:
    description: Additional k6 CLI arguments (passed after --)
    required: false
    default: ''
  artifact-name:
    description: Name for the uploaded results artifact
    required: false
    default: 'stroppy-results'

outputs:
  exit-code:
    description: Exit code from the stroppy run
  results-file:
    description: Path to the JSON results file
  artifact-id:
    description: ID of the uploaded artifact

runs:
  using: node24
  main: dist/index.js
